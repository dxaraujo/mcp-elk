[project]
name = "mcp-elk"
version = "3.0.1"
description = "MCP do ELK (Elasticsearch/Kibana): logs pela config do projeto, contagem comparada, exportação CSV, execução de job Spring Batch e consultas salvas"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Daniel Xavier Araújo", email = "danielxaraujo@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=2.2",
    "requests>=2.31",
    "jsonschema>=4",
]

[project.urls]
Repository = "https://github.com/dxaraujo/kiro/tree/main/mcps/elk"

[project.scripts]
mcp-elk = "mcp_elk.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["mcp_elk"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
